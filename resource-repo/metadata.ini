[asbuilt_depth_geocoder]
name=Géocodeur As-Built (profondeur de pose)
author=Equipe SIG Constructel
email=sig@constructel.fr
tags=processing, geocodage, as-built, profondeur, segments, constructel
description=Geocode les rapports As-Built GeoFiber, categorise par profondeur de pose (rouge < 50 cm / orange 50-55 / vert >= 55) et genere les segments d'axe de rue par cote de la route (projection orthogonale, decalage selon le type de voie, pointille >= 100 m, largeur progressive selon l'echelle de chaque page atlas (0.15 a 3 mm) ; repli OSM/Overpass si la base n'a pas les routes). Profondeur des adresses deja en base mise a jour par un rapport plus recent (date d'envoi du .msg), sans re-geocodage.
qgis_minimum_version=3.28
qgis_maximum_version=4.99

version=1.2.1

[layers_to_atlas]
name=Layers to Atlas — Atlas PDF
author=Equipe SIG Constructel
email=sig@constructel.fr
tags=processing, atlas, pdf, cartographie, impression, mise en page, constructel
description=Script Processing autonome pour créer un atlas PDF A3/A4 paysage à partir d'une sélection, d'une couche, du canevas ou d'une emprise. Suit les couches visibles, leur ordre et leurs styles dans le projet courant. Index automatique à côté du PDF et ouverture du dossier après export. Options avancées pour personnaliser l'atlas. Ressource SVG Constructel incluse. Aucun moteur SQL ou autre plugin requis.
qgis_minimum_version=3.44
qgis_maximum_version=4.99
version=1.2.0
